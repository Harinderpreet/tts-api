services:
  alignment:
    build: .
    image: forced-alignment:local
    init: true
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 6g
    memswap_limit: 6g
    ports:
      - "127.0.0.1:${ALIGNMENT_PUBLISHED_PORT:-8000}:8000"
    environment:
      ALIGNMENT_WORKERS: "1"
      ALIGNMENT_CPU_THREADS: "2"
      ALIGNMENT_WINDOW_SECONDS: "10"
      ALIGNMENT_BATCH_SIZE: "1"
      ALIGNMENT_MAX_QUEUED: "4"
      ALIGNMENT_QUEUE_TIMEOUT: "600"
      ALIGNMENT_MAX_UPLOAD_MB: "100"
